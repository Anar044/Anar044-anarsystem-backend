name: Repair order fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          marker = '''function historicalOrderDetails(plugin, number) {'''
          helper = '''function deepValueByNames(data, names, depth = 0) {
              if (!data || typeof data !== "object" || depth > 12) return null;
              const wanted = names.map(x => String(x).toLowerCase());
              for (const [key, value] of Object.entries(data)) {
                  if (wanted.includes(key.toLowerCase()) && value !== null && value !== undefined && value !== "") return value;
              }
              for (const child of Object.values(data)) {
                  const found = deepValueByNames(child, names, depth + 1);
                  if (found !== null && found !== undefined && found !== "") return found;
              }
              return null;
          }

          '''
          if 'function deepValueByNames(' not in s:
              s = s.replace(marker, helper + marker, 1)
          start = s.index('function historicalOrderDetails(')
          end = s.index('\nfunction mergeOrderEvent(', start)
          block = s[start:end].replace('valueByNames(data, names)', 'deepValueByNames(data, names)')
          s = s[:start] + block + s[end:]
          start = s.index('function mergeOrderEvent(')
          end = s.index('\nfunction restoreOrderDetails(', start)
          block = s[start:end]
          pairs = {
              'data.tables ?? data.orderTables ?? old.tables ?? null': 'deepValueByNames(data, ["tables", "orderTables", "table", "tableName"]) ?? old.tables ?? null',
              'data.floor ?? data.floorName ?? old.floor ?? null': 'deepValueByNames(data, ["floor", "floorName", "restaurantSection", "section", "hall"]) ?? old.floor ?? null',
              'data.waiter ?? data.waiterName ?? old.waiter ?? null': 'deepValueByNames(data, ["waiter", "waiterName", "waiterFullName", "employee", "employeeName", "employeeFullName"]) ?? old.waiter ?? null',
              'data.cashier ?? data.cashierName ?? old.cashier ?? null': 'deepValueByNames(data, ["cashier", "cashierName", "cashierFullName"]) ?? old.cashier ?? null',
              'data.revenue ?? data.resultSum ?? data.orderSum ?? old.revenue ?? null': 'deepValueByNames(data, ["revenue", "resultSum", "orderSum", "sum", "total"]) ?? old.revenue ?? null',
              'data.payments ?? data.payment ?? data.paymentType ?? data.paymentTypeName ?? old.payments ?? null': 'deepValueByNames(data, ["payments", "payment", "paymentType", "paymentTypeName", "paymentMethod", "paymentName"]) ?? old.payments ?? null',
              'data.openTime ?? data.orderOpenDate ?? old.openTime ?? null': 'deepValueByNames(data, ["openTime", "orderOpenDate", "openedAt", "openingTime"]) ?? old.openTime ?? null',
              'data.billTime ?? data.orderBillTime ?? old.billTime ?? null': 'deepValueByNames(data, ["billTime", "orderBillTime", "precheckTime", "precheckAt"]) ?? old.billTime ?? null',
              'data.closeTime ?? data.orderCloseTime ?? old.closeTime ?? null': 'deepValueByNames(data, ["closeTime", "orderCloseTime", "closedAt", "closingTime"]) ?? old.closeTime ?? null'
          }
          for a,b in pairs.items(): block = block.replace(a,b)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if ! git diff --cached --quiet; then git commit -m "Fix nested order hall staff and payment fields"; git push; fi
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-order-fields.yml
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Remove temporary repair workflow"; git push; fi
