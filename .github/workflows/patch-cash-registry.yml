name: Patch cash registry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch server-core.js
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'server-core.js';
          let s = fs.readFileSync(p, 'utf8');
          const original = s;

          // 1) Keep live plugin payload in /api/plugin/data.
          const oldRoute = `app.get("/api/plugin/data", (req, res) => {
              const hasBinding = requestedDepartmentIds(req.query || {}).length > 0;
              const source = Array.from(pluginRegistry.values());
              const visible = hasBinding ? source.filter(plugin => pluginMatchesBinding(plugin, req.query || {})) : source;
              const pluginsOut = visible.map(p => ({ pluginId: p.pluginId, pluginName: p.pluginName, departmentId: p.departmentId, departmentName: p.departmentName, groupId: p.groupId, groupName: p.groupName, version: p.version, currencyCode: p.currencyCode, lastEventAt: p.lastEventAt || null, connectedAt: p.connectedAt || null, disconnectedAt: p.disconnectedAt || null, online: p.online === true }));
              const groupsMap = new Map();
              for (const p of pluginsOut) {
                  const key = String(p.groupId || p.groupName || "unknown");
                  if (!groupsMap.has(key)) groupsMap.set(key, { groupId: p.groupId || null, groupName: p.groupName || "Без группы", departmentId: p.departmentId || null, departmentName: p.departmentName || null, cashRegisters: [] });
                  groupsMap.get(key).cashRegisters.push(p);
              }
              res.json({ success: true, count: pluginsOut.length, plugins: pluginsOut, groups: Array.from(groupsMap.values()) });
          });`;
          const newRoute = `app.get("/api/plugin/data", (req, res) => {
              const hasBinding = requestedDepartmentIds(req.query || {}).length > 0;
              const source = Array.from(pluginRegistry.values());
              const visible = hasBinding ? source.filter(plugin => pluginMatchesBinding(plugin, req.query || {})) : source;
              const activeById = new Map();
              for (const active of plugins.values()) {
                  if (active?.pluginId) activeById.set(String(active.pluginId), active);
              }
              const pluginsOut = visible.map(p => {
                  const active = activeById.get(String(p.pluginId));
                  return {
                      pluginId: p.pluginId,
                      pluginName: active?.pluginName || p.pluginName,
                      departmentId: active?.departmentId || p.departmentId,
                      departmentName: active?.departmentName || p.departmentName,
                      groupId: active?.groupId || p.groupId,
                      groupName: active?.groupName || p.groupName,
                      version: active?.version || p.version,
                      currencyCode: active?.currencyCode || p.currencyCode,
                      lastEventAt: active?.lastEventAt || p.lastEventAt || null,
                      connectedAt: active?.connectedAt || p.connectedAt || null,
                      disconnectedAt: active ? null : (p.disconnectedAt || null),
                      online: !!active,
                      data: active?.lastEvent || null
                  };
              });
              const groupsMap = new Map();
              for (const p of pluginsOut) {
                  const key = String(p.groupId || p.groupName || "unknown");
                  if (!groupsMap.has(key)) groupsMap.set(key, { groupId: p.groupId || null, groupName: p.groupName || "Без группы", departmentId: p.departmentId || null, departmentName: p.departmentName || null, cashRegisters: [] });
                  groupsMap.get(key).cashRegisters.push(p);
              }
              res.json({ success: true, count: pluginsOut.length, plugins: pluginsOut, groups: Array.from(groupsMap.values()) });
          });`;
          if (s.includes(oldRoute)) {
              s = s.replace(oldRoute, newRoute);
          } else if (s.includes('const pluginsOut = visible.map(p => ({ pluginId: p.pluginId, pluginName: p.pluginName')) && s.includes('data: active?.lastEvent')) {
              console.log('Live plugin data patch already present');
          } else {
              throw new Error('Expected registry route not found');
          }

          // 2) Plugin sends business events through plugin_to_server. Save those
          // events as the live payload as well as handling request responses.
          const marker = '        plugin.lastResponseAt = now();\n';
          const insertion = `        plugin.lastResponseAt = now();\n        if (message && typeof message === "object" && message.pluginEventType) {\n            plugin.lastEvent = message;\n            plugin.lastEventAt = now();\n            console.log("PLUGIN EVENT", plugin.pluginId, message.pluginEventType);\n            if (plugin.pluginId) {\n                pluginRegistry.set(String(plugin.pluginId), {\n                    ...(pluginRegistry.get(String(plugin.pluginId)) || {}),\n                    pluginId: plugin.pluginId,\n                    pluginName: plugin.pluginName,\n                    departmentId: plugin.departmentId,\n                    departmentName: plugin.departmentName,\n                    groupId: plugin.groupId,\n                    groupName: plugin.groupName,\n                    version: plugin.version,\n                    currencyCode: plugin.currencyCode,\n                    lastEventAt: plugin.lastEventAt,\n                    connectedAt: plugin.connectedAt,\n                    disconnectedAt: null,\n                    online: true\n                });\n            }\n        }\n`;
          if (s.includes('console.log("PLUGIN EVENT", plugin.pluginId, message.pluginEventType);')) {
              console.log('Plugin event capture already present');
          } else if (s.includes(marker)) {
              s = s.replace(marker, insertion);
          } else {
              throw new Error('plugin_to_server insertion marker not found');
          }

          if (s !== original) fs.writeFileSync(p, s);
          NODE
      - name: Commit patched server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-core.js
          git commit -m "Capture plugin events for cash data" || exit 0
          git push
