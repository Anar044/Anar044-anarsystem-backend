name: Fix server core syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typo and preserve workflow cleanliness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server-core.js')
          s = p.read_text()
          s2 = s.replace('typeof value === "object\') return null;', 'typeof value !== "object") return null;')
          if s2 == s:
              raise SystemExit('target typo not found')
          p.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-core.js
          git commit -m "Fix server core syntax"
          git push
