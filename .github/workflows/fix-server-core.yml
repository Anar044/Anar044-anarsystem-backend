name: Fix server core syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server-core.js')
          s = p.read_text()
          bad = "    if (typeof value === \"object') return null;\n"
          good = "    if (typeof value !== \"object\") return null;\n"
          if bad not in s:
              raise SystemExit('target typo not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          rm -f .github/workflows/fix-server-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-core.js .github/workflows/fix-server-core.yml
          git commit -m "Fix server core syntax and remove temporary workflow"
          git push
